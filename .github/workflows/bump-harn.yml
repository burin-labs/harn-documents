name: Bump Harn Runtime

# fleet.toml in harn-bump-fleet owns this generated dispatch adapter.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Harn tag (vX.Y.Z). Defaults to latest."
        required: false
        type: string

permissions:
  contents: read

jobs:
  bump:
    uses: burin-labs/harn/.github/workflows/bump-harn.yml@9ebe2f0f4dff51322a54433256a2a02aed5dfca8
    with:
      orchestration-sha: 9ebe2f0f4dff51322a54433256a2a02aed5dfca8
      version: ${{ inputs.version }}
      # This package's API documentation is generated from its exported Harn symbols,
      # so moving the runtime can change the rendered output. Regenerate it inside the
      # bump, or the bump commits a tree its own package verification then refuses.
      refresh-command: |-
        harn install --locked || harn install
        harn package docs .
      validate-command: harn package verify .
      publish-failure-for-repair: true
      apply-behavior-preserving-fixes: false
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
